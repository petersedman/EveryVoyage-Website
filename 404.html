<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EveryVoyage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFECD2;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }
    .stores {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stores a {
      display: inline-block;
    }
    .stores img {
      height: 44px;
    }
  </style>
  <script>
    (function () {
      // Share links (https://everyvoyage.com/follow|trip|moment/{id}) are universal/
      // app links: when the app is installed, iOS/Android open it directly and this
      // page never loads. We only land here when the app is NOT installed, so we show
      // a branded "get the app" page and let the visitor TAP a store badge.
      //
      // We deliberately do NOT auto-redirect to the store: a script-initiated redirect
      // makes iOS interpose an "Open this link in the App Store?" system prompt, while
      // a user tap on a store badge hands off to the store cleanly. (The custom
      // everyvoyage:// scheme is also avoided — without the app it blanks the page.)
      var path = window.location.pathname || '';
      var deepLinkRoutes = ['/follow/', '/trip/', '/moment/'];
      var isShareLink = deepLinkRoutes.some(function (route) {
        return path.indexOf(route) === 0;
      });

      if (!isShareLink) {
        // Genuine 404 (not a share link): keep the store badges, but swap in
        // page-not-found copy instead of "open this link".
        document.addEventListener('DOMContentLoaded', function () {
          var title = document.getElementById('title');
          var subtitle = document.getElementById('subtitle');
          if (title) title.textContent = 'Page not found';
          if (subtitle) subtitle.textContent = 'The page you’re looking for doesn’t exist.';
        });
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <img src="/assets/icons/favicon.png" alt="EveryVoyage" class="logo">
    <h1 id="title">Get EveryVoyage</h1>
    <p id="subtitle">Download the app to open this link.</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6755696102" target="_blank">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.everyvoyage.app" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
      </a>
    </div>
  </div>
</body>
</html>
