<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EveryVoyage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FFECD2;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p {
      font-size: 16px;
      color: #555;
      margin-bottom: 24px;
    }
    .stores {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .stores a {
      display: inline-block;
    }
    .stores img {
      height: 44px;
    }
  </style>
  <script>
    (function () {
      // Share links (https://everyvoyage.com/follow|trip|moment/{id}) are universal/
      // app links: when the app is installed, iOS/Android open it directly and this
      // page never loads. We only get here when the app is NOT installed (or the link
      // was pasted into the address bar, which bypasses universal links), so send the
      // visitor to the right store. We deliberately do NOT bounce through the
      // everyvoyage:// custom scheme — on a device without the app that leaves the
      // browser on a blank/error page.
      var path = window.location.pathname || '';
      var deepLinkRoutes = ['/follow/', '/trip/', '/moment/'];
      var isShareLink = deepLinkRoutes.some(function (route) {
        return path.indexOf(route) === 0;
      });

      if (isShareLink) {
        var ua = navigator.userAgent || navigator.vendor || window.opera || '';
        var IOS_URL = 'https://apps.apple.com/app/id6755696102';
        var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.everyvoyage.app';

        var isAndroid = /android/i.test(ua);
        var isIOS = /iPad|iPhone|iPod/.test(ua)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (isAndroid) {
          window.location.replace(ANDROID_URL);
        } else if (isIOS) {
          window.location.replace(IOS_URL);
        }
        // Desktop / unknown: fall through and show the store badges below.
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <img src="/assets/icons/favicon.png" alt="EveryVoyage" class="logo">
    <h1>Get EveryVoyage</h1>
    <p>Download the app to open this link.</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6755696102" target="_blank">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store">
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.everyvoyage.app" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play">
      </a>
    </div>
  </div>
</body>
</html>
