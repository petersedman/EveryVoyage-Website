<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Open in EveryVoyage</title>
  <meta
    name="description"
    content="Open this road trip, Moment or traveller profile in the EveryVoyage app."
  >
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f54a00">

  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="/assets/icons/favicon.png">

  <!-- Shows Apple's native Smart App Banner in Safari. -->
  <meta name="apple-itunes-app" content="app-id=6755696102">

  <style>
    :root {
      --cream: #f7f4ed;
      --paper: #fffdf9;
      --ink: #262725;
      --muted: #686a66;
      --orange: #f54a00;
      --orange-dark: #d94100;
      --orange-soft: #fff0e8;
      --forest: #173d3c;
      --line: rgba(38, 39, 37, .11);
      --shadow: 0 28px 80px rgba(20, 45, 44, .15);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-height: 100svh;
      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 14% 12%, rgba(245, 74, 0, .12), transparent 26rem),
        radial-gradient(circle at 88% 84%, rgba(23, 61, 60, .12), transparent 30rem),
        var(--cream);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page-shell {
      width: min(100%, 980px);
    }

    .brand {
      width: min(205px, 56vw);
      margin: 0 auto 22px;
      display: block;
    }

    .brand img {
      width: 100%;
      height: auto;
      display: block;
    }

    .handoff-card {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .78fr);
      min-height: 520px;
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 34px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .handoff-copy {
      position: relative;
      z-index: 2;
      padding: clamp(34px, 6vw, 68px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      margin-bottom: 14px;
      color: var(--orange);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(42px, 6.2vw, 72px);
      font-weight: 500;
      line-height: .98;
      letter-spacing: -.048em;
    }

    h1 em {
      display: block;
      color: var(--orange);
      font-style: italic;
    }

    .subtitle {
      max-width: 560px;
      margin-top: 20px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
    }

    .link-type {
      margin-top: 16px;
      display: inline-flex;
      align-self: flex-start;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      font-size: 11px;
      font-weight: 850;
    }

    .store-area {
      margin-top: 28px;
    }

    .store-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      flex-wrap: wrap;
    }

    .store-link {
      display: block;
      border-radius: 8px;
      text-decoration: none;
      transition: transform .22s var(--ease);
    }

    .store-link:hover {
      transform: translateY(-2px);
    }

    .store-link img {
      display: block;
      width: auto;
      height: 48px;
    }

    .home-link {
      margin-top: 23px;
      display: inline-flex;
      align-self: flex-start;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--orange);
    }

    .desktop-panel {
      position: relative;
      padding: 36px;
      display: grid;
      align-content: center;
      justify-items: center;
      background:
        radial-gradient(circle at 50% 32%, rgba(245, 74, 0, .18), transparent 35%),
        linear-gradient(145deg, var(--forest), #0f2928);
      color: #fff;
      text-align: center;
    }

    .desktop-panel::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 26px;
      pointer-events: none;
    }

    .app-icon {
      position: relative;
      z-index: 2;
      width: 74px;
      height: 74px;
      margin-bottom: 18px;
      border-radius: 20px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, .25);
    }

    .desktop-panel strong {
      position: relative;
      z-index: 2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.05;
    }

    .desktop-panel p {
      position: relative;
      z-index: 2;
      max-width: 270px;
      margin-top: 10px;
      color: rgba(255, 255, 255, .67);
      font-size: 13px;
    }

    .qr-code {
      position: relative;
      z-index: 2;
      width: min(230px, 65vw);
      height: auto;
      margin-top: 22px;
      border-radius: 17px;
      background: #fff;
    }

    .qr-url {
      position: relative;
      z-index: 2;
      margin-top: 13px;
      color: rgba(255, 255, 255, .7);
      font-size: 12px;
      font-weight: 750;
      text-decoration: none;
    }

    .qr-url:hover {
      color: #fff;
    }

    .not-found-actions {
      display: none;
      margin-top: 28px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .primary-button,
    .secondary-button {
      min-height: 47px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 850;
      text-decoration: none;
    }

    .primary-button {
      background: var(--orange);
      color: #fff;
      box-shadow: 0 10px 24px rgba(245, 74, 0, .22);
    }

    .primary-button:hover {
      background: var(--orange-dark);
    }

    .secondary-button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    .secondary-button:hover {
      background: var(--orange-soft);
      color: var(--orange-dark);
    }

    body.is-ios .android-store,
    body.is-android .ios-store {
      display: none;
    }

    body.is-mobile .desktop-panel {
      display: none;
    }

    body.is-mobile .handoff-card {
      display: block;
      min-height: 0;
      max-width: 560px;
      margin-inline: auto;
    }

    body.is-mobile .handoff-copy {
      min-height: 500px;
      text-align: center;
      align-items: center;
    }

    body.is-mobile .link-type,
    body.is-mobile .home-link {
      align-self: center;
    }

    body.is-mobile .store-row {
      justify-content: center;
    }

    body.is-not-found .store-area,
    body.is-not-found .link-type {
      display: none;
    }

    body.is-not-found .not-found-actions {
      display: flex;
    }

    body.is-not-found .desktop-panel strong {
      font-size: 27px;
    }

    @media (max-width: 760px) {
      .handoff-card {
        grid-template-columns: 1fr;
      }

      .handoff-copy {
        padding: 38px 25px;
      }

      .desktop-panel {
        padding: 35px 24px 40px;
      }

      .store-link img {
        height: 43px;
      }
    }

    @media (max-width: 390px) {
      body {
        padding-inline: 12px;
      }

      .handoff-card {
        border-radius: 27px;
      }

      .handoff-copy {
        padding-inline: 20px;
      }

      h1 {
        font-size: 40px;
      }

      .store-row {
        gap: 9px;
      }

      .store-link img {
        height: 39px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .store-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <a class="brand" href="/" aria-label="EveryVoyage home">
      <img src="/assets/brand/Logo.png" alt="EveryVoyage">
    </a>

    <section class="handoff-card" aria-labelledby="title">
      <div class="handoff-copy">
        <span class="eyebrow" id="eyebrow">OPEN IN EVERYVOYAGE</span>

        <h1 id="title">
          Continue the journey.
          <em>Get EveryVoyage.</em>
        </h1>

        <p class="subtitle" id="subtitle">
          Download the app to open this shared road trip.
        </p>

        <span class="link-type" id="linkType">Shared journey</span>

        <div class="store-area">
          <div class="store-row" aria-label="Download EveryVoyage">
            <a
              class="store-link ios-store"
              href="https://apps.apple.com/app/id6755696102"
              target="_blank"
              rel="noopener"
            >
              <img
                src="/assets/stores/download-on-the-app-store.svg"
                alt="Download EveryVoyage on the App Store"
              >
            </a>

            <a
              class="store-link android-store"
              href="https://play.google.com/store/apps/details?id=com.everyvoyage.app"
              target="_blank"
              rel="noopener"
            >
              <img
                src="/assets/stores/Google_Play_Store_badge_EN.svg"
                alt="Get EveryVoyage on Google Play"
              >
            </a>
          </div>
        </div>

        <div class="not-found-actions">
          <a class="primary-button" href="/">Return to EveryVoyage</a>
          <a class="secondary-button" href="/app">Get the app</a>
        </div>

        <a class="home-link" href="/">Continue to everyvoyage.com</a>
      </div>

      <aside class="desktop-panel" aria-label="Scan to get EveryVoyage">
        <img
          class="app-icon"
          src="/assets/icons/favicon.png"
          alt=""
          aria-hidden="true"
        >

        <strong id="panelTitle">Scan to get the app</strong>

        <p id="panelCopy">
          Open your phone camera and point it at the QR code.
        </p>

        <img
          class="qr-code"
          src="/assets/img/EveryVoyageQR.png"
          alt="QR code linking to the EveryVoyage app download page"
        >

        <a
          class="qr-url"
          href="https://everyvoyage.com/app"
          target="_blank"
          rel="noopener"
        >everyvoyage.com/app</a>
      </aside>
    </section>
  </main>

  <script>
    (function () {
      var path = window.location.pathname || "";
      var userAgent = navigator.userAgent || navigator.vendor || window.opera || "";

      var isAndroid = /android/i.test(userAgent);
      var isIOS =
        /iPad|iPhone|iPod/i.test(userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      var routeConfig = [
        {
          prefix: "/follow/",
          label: "Traveller profile",
          title: "Meet another traveller.",
          accent: "Follow their journey.",
          subtitle: "Download EveryVoyage to open this traveller profile."
        },
        {
          prefix: "/trip/",
          label: "Shared Trip",
          title: "See the road they took.",
          accent: "Open the Trip.",
          subtitle: "Download EveryVoyage to view this shared road trip."
        },
        {
          prefix: "/moment/",
          label: "Shared Moment",
          title: "See where it happened.",
          accent: "Open the Moment.",
          subtitle: "Download EveryVoyage to view this shared Moment."
        }
      ];

      var route = routeConfig.find(function (item) {
        return path.indexOf(item.prefix) === 0;
      });

      if (isIOS) {
        document.body.classList.add("is-mobile", "is-ios");
      } else if (isAndroid) {
        document.body.classList.add("is-mobile", "is-android");
      }

      if (route) {
        document.title = route.label + " | EveryVoyage";

        document.getElementById("title").innerHTML =
          route.title + "<em>" + route.accent + "</em>";

        document.getElementById("subtitle").textContent = route.subtitle;
        document.getElementById("linkType").textContent = route.label;
        return;
      }

      document.body.classList.add("is-not-found");
      document.title = "Page not found | EveryVoyage";

      document.getElementById("eyebrow").textContent = "EVERYVOYAGE";
      document.getElementById("title").innerHTML =
        "Page not found.<em>Keep exploring.</em>";
      document.getElementById("subtitle").textContent =
        "The page you’re looking for doesn’t exist or may have moved.";
      document.getElementById("panelTitle").textContent =
        "Plan, track and relive road trips";
      document.getElementById("panelCopy").textContent =
        "Discover EveryVoyage on iPhone and Android.";
    })();
  </script>
</body>
</html>
