  <style>
    :root{
      --paper:#fffdf9;
      --ink:#262725;
      --muted:#747772;
      --orange:#f54a00;
      --orange-dark:#d94100;
      --line:rgba(38,39,37,.12);
      --display:'Fraunces',Georgia,'Times New Roman',serif;
      --body:'DM Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }

    *{box-sizing:border-box}

    html,body{min-height:100%}

    body{
      margin:0;
      min-height:100svh;
      display:flex;
      flex-direction:column;
      background:var(--paper);
      color:var(--ink);
      font-family:var(--body);
      -webkit-font-smoothing:antialiased;
    }

    main{
      flex:1;
      display:grid;
      place-items:center;
      padding:clamp(34px,7vh,72px) 22px 54px;
    }

    .handoff-card{
      width:min(660px,100%);
      text-align:center;
    }

    .brand{
      display:block;
      width:min(210px,55vw);
      margin:0 auto 34px;
    }

    .brand img{
      width:100%;
      height:auto;
    }

    .app-icon{
      width:112px;
      height:112px;
      margin:0 auto 30px;
      overflow:hidden;
      border:1px solid rgba(38,39,37,.08);
      border-radius:27px;
      background:#fff;
      box-shadow:0 16px 38px rgba(23,61,60,.12);
    }

    .app-icon img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    h1{
      max-width:620px;
      margin:0 auto;
      font-family:var(--display);
      font-size:clamp(42px,7.2vw,66px);
      font-weight:600;
      line-height:.98;
      letter-spacing:-.05em;
    }

    .handoff-copy{
      max-width:520px;
      margin:21px auto 0;
      color:var(--muted);
      font-size:clamp(17px,2.3vw,21px);
      line-height:1.48;
    }

    .store-button{
      width:100%;
      min-height:66px;
      margin-top:32px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 24px;
      border-radius:22px;
      background:var(--orange);
      color:#fff;
      box-shadow:0 15px 34px rgba(245,74,0,.22);
      font-size:18px;
      font-weight:800;
      text-decoration:none;
      transition:transform .2s ease,background .2s ease;
    }

    .store-button:hover{
      transform:translateY(-2px);
      background:var(--orange-dark);
    }

    .redirect-status{
      min-height:21px;
      margin:18px 0 0;
      color:#969b96;
      font-size:13px;
      font-weight:700;
    }

    .progress{
      width:112px;
      height:4px;
      margin:12px auto 0;
      overflow:hidden;
      border-radius:99px;
      background:#e6e7e3;
    }

    .progress::after{
      content:"";
      display:block;
      width:100%;
      height:100%;
      border-radius:inherit;
      background:var(--orange);
      transform:translateX(-100%);
      animation:redirectProgress 1.25s linear forwards;
    }

    @keyframes redirectProgress{
      to{transform:translateX(0)}
    }

    footer{
      padding:22px 20px max(22px,env(safe-area-inset-bottom));
      border-top:1px solid var(--line);
      background:#f3f4f4;
      text-align:center;
    }

    footer a{
      color:var(--orange);
      font-size:15px;
      font-weight:800;
      text-decoration:none;
    }

    .noscript-links{
      width:min(620px,calc(100% - 32px));
      margin:24px auto;
      padding:18px;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      text-align:center;
    }

    .noscript-links a{
      display:block;
      margin:10px;
      color:var(--orange);
      font-weight:800;
    }

    @media(max-width:600px){
      main{padding-top:34px}
      .brand{width:180px;margin-bottom:28px}
      .app-icon{width:98px;height:98px;margin-bottom:26px;border-radius:23px}
      .store-button{min-height:62px;border-radius:20px}
    }

    @media(max-height:720px){
      main{padding-top:24px;padding-bottom:30px}
      .brand{margin-bottom:20px}
      .app-icon{width:82px;height:82px;margin-bottom:20px;border-radius:20px}
      .handoff-copy{margin-top:15px}
      .store-button{margin-top:23px}
    }

    @media(prefers-reduced-motion:reduce){
      .progress::after{animation:none;transform:none}
      .store-button{transition:none}
    }
  

    .desktop-qr{
      display:none;
      width:min(300px,76vw);
      height:auto;
      margin:26px auto 0;
      border-radius:18px;
      background:#fff;
    }

    .desktop-url{
      display:none;
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
      font-weight:750;
      text-decoration:none;
    }

    .desktop-url:hover{color:var(--orange)}

<body>
  <main>
    <section class="handoff-card" aria-labelledby="handoffTitle">
      <a class="brand" href="https://everyvoyage.com/nl/" aria-label="EveryVoyage-homepage">
        <img src="/assets/brand/Logo.png" alt="EveryVoyage">
      </a>

      <div class="app-icon" aria-hidden="true">
        <img src="/assets/icons/favicon.png" alt="">
      </div>

      <h1 id="handoffTitle">We sturen je door naar de appstore</h1>
      <p class="handoff-copy" id="handoffCopy">EveryVoyage wordt als het goed is automatisch geopend.</p>

      <a
        class="desktop-url"
        id="desktopUrl"
        href="https://everyvoyage.com/nl/app/"
      >everyvoyage.com/nl/app</a>

      <img
        class="desktop-qr"
        id="desktopQr"
        src="/assets/img/EveryVoyageQR.png"
        alt="QR-code naar de downloadpagina van de EveryVoyage-app"
      >

      <a class="store-button" id="storeButton" href="https://everyvoyage.com/#download">
        Download de EveryVoyage-app
      </a>

      <p class="redirect-status" id="redirectStatus" role="status" aria-live="polite">
        De juiste store voor je apparaat zoeken…
      </p>

      <div class="progress" id="progress" aria-hidden="true"></div>
    </section>
  </main>

  <footer>
    <a href="https://everyvoyage.com/nl/">Ga verder naar everyvoyage.com</a>
  </footer>

  <noscript>
    <div class="noscript-links">
      <strong>Kies waar je EveryVoyage wilt downloaden:</strong>
      <a href="https://apps.apple.com/app/id6755696102">Open de App Store</a>
      <a href="https://play.google.com/store/apps/details?id=com.everyvoyage.app">Open Google Play</a>
      <a href="https://everyvoyage.com/nl/">Ga verder naar everyvoyage.com</a>
    </div>
  </noscript>

  <script>
    (function(){
      const IOS_URL='https://apps.apple.com/app/id6755696102';
      const ANDROID_URL='https://play.google.com/store/apps/details?id=com.everyvoyage.app';
      const WEBSITE_URL='https://everyvoyage.com/nl/';

      const ua=navigator.userAgent||navigator.vendor||window.opera||'';
      const isAndroid=/android/i.test(ua);
      const isIOS=/iPad|iPhone|iPod/i.test(ua)
        ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

      const title=document.getElementById('handoffTitle');
      const copy=document.getElementById('handoffCopy');
      const button=document.getElementById('storeButton');
      const status=document.getElementById('redirectStatus');
      const progress=document.getElementById('progress');
      const desktopQr=document.getElementById('desktopQr');
      const desktopUrl=document.getElementById('desktopUrl');

      let target=WEBSITE_URL;
      let delay=500;

      if(isIOS){
        target=IOS_URL;
        title.textContent='Je wordt doorgestuurd naar de App Store';
        copy.textContent='EveryVoyage wordt als het goed is automatisch geopend.';
        button.textContent='Open de App Store';
        status.textContent='Doorsturen naar de App Store…';
        delay=1250;
      }else if(isAndroid){
        target=ANDROID_URL;
        title.textContent='Je wordt doorgestuurd naar Google Play';
        copy.textContent='EveryVoyage wordt als het goed is automatisch geopend.';
        button.textContent='Open Google Play';
        status.textContent='Doorsturen naar Google Play…';
        delay=1250;
      }else{
        title.textContent='Scan om de app te downloaden';
        copy.textContent='Open de camera van je telefoon en richt deze op de QR-code.';
        button.textContent='Ga verder naar everyvoyage.com';
        button.href=WEBSITE_URL;
        status.hidden=true;
        progress.hidden=true;
        desktopQr.style.display='block';
        desktopUrl.style.display='inline-block';
        return;
      }

      button.href=target;

      window.setTimeout(function(){
        window.location.replace(target);
      },delay);
    })();
  </script>
</body>
</html>
